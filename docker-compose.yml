version: '3.8'

networks:
  My-network:
    driver: bridge

services:
  mongodb:
    image: mongo:latest
    container_name: mongo-netflix
    restart: always
    # Not published to the host: only the API needs MongoDB (seeding uses docker exec).
    volumes:
      - mongodb_data:/data/db
    networks:
      - My-network

  web-server:
    build:
      context: .
      dockerfile: Dockerfile.web-ser
    container_name: web-ser
    ports:
      - "3000:3000"
    environment:
      MONGO_URI: mongodb://mongodb:27017/netflix
      RECSERVER_HOST: recserver
      RECSERVER_PORT: 8000
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (see .env.example)}
    volumes:
      - ./src:/app/src
    networks:
      - My-network
    depends_on:
      - mongodb
      - recserver

  recserver:
    build:
      context: .
      dockerfile: Dockerfile.recserver
    container_name: recserver
    # Not published to the host: the protocol has no authentication, so only the API may reach it.
    volumes:
      - recserver_data:/app/data
    networks:
      - My-network

volumes:
  mongodb_data:
    driver: local
  recserver_data:
    driver: local
