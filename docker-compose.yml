networks:
  My-network:
    driver: bridge

services:
  mongodb:
    image: mongo:latest
    container_name: mongo-netflix
    restart: always
    volumes:
      - mongodb_data:/data/db
    networks:
      - My-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  web-server:
    build:
      context: .
      dockerfile: Dockerfile.web-ser
    container_name: web-ser
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MONGO_URI: mongodb://mongodb:27017/netflix
      RECSERVER_HOST: recserver
      RECSERVER_PORT: 8000
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (see .env.example)}
    volumes:
      - ./src/apiServer:/app/src/apiServer
    networks:
      - My-network
    depends_on:
      mongodb:
        condition: service_healthy
      recserver:
        condition: service_started

  recserver:
    build:
      context: .
      dockerfile: Dockerfile.recserver
    container_name: recserver
    restart: unless-stopped
    volumes:
      - recserver_data:/app/data
    networks:
      - My-network

volumes:
  mongodb_data:
    driver: local
  recserver_data:
    driver: local
